{% extends "base.html" %}
{% block title %}Events - SeatLock{% endblock %}
{% block content %}
<h2 class="page-title">Events</h2>
<div class="row g-3">
  {% for e in events %}
  <div class="col-md-6 col-lg-4">
    <div class="card h-100 p-3">
      <h5>{{ e.title }}</h5>
      <p class="text-muted mb-3">Starts: {{ e.starts_at|date:"d M Y, H:i" }}</p>
      <a class="btn btn-primary mt-auto" href="/events/{{ e.id }}/">View seat map</a>
    </div>
  </div>
  {% empty %}
  <p class="text-muted">No events available.</p>
  {% endfor %}
</div>
{% endblock %}
