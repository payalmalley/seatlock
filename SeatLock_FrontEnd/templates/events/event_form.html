{% extends "base.html" %}
{% block title %}Create event - SeatLock{% endblock %}
{% block extra_head %}
<style>
  .sl-field textarea {
    width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 16px;
    font-size: 1rem; outline: 0; background: var(--soft); font-family: inherit; resize: vertical;
    transition: border .15s, background .15s;
  }
  .sl-field textarea:focus { border-color: var(--pink); background: #fff; }
  .sl-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .sl-form-grid { grid-template-columns: 1fr; } }
</style>
{% endblock %}
{% block content %}
<div class="sl-auth-wrap">
  <div class="sl-auth" style="max-width:600px">
    <h1>Create an event</h1>
    <p class="sub">It is published right away, with seats generated for you.</p>
    {% if error %}<div class="sl-alert sl-alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/events/new/">
      {% csrf_token %}
      <div class="sl-field">
        <label for="title">Event title</label>
        <input type="text" id="title" name="title" value="{{ form.title|default:'' }}" placeholder="Annual Tech Fest" required autofocus>
      </div>
      <div class="sl-field">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3" placeholder="What is this event about?">{{ form.description|default:'' }}</textarea>
      </div>
      <div class="sl-form-grid">
        <div class="sl-field">
          <label for="venue">Venue</label>
          <input type="text" id="venue" name="venue" value="{{ form.venue|default:'' }}" placeholder="Main Auditorium">
        </div>
        <div class="sl-field">
          <label for="starts_at">Starts at</label>
          <input type="datetime-local" id="starts_at" name="starts_at" value="{{ form.starts_at|default:'' }}" required>
        </div>
        <div class="sl-field">
          <label for="rows">Rows (A, B, C...)</label>
          <input type="number" id="rows" name="rows" min="1" max="26" value="{{ form.rows|default:6 }}" required>
        </div>
        <div class="sl-field">
          <label for="seats_per_row">Seats per row</label>
          <input type="number" id="seats_per_row" name="seats_per_row" min="1" max="30" value="{{ form.seats_per_row|default:10 }}" required>
        </div>
      </div>
      <button class="sl-btn sl-btn-block">Create event</button>
    </form>
  </div>
</div>
{% endblock %}
