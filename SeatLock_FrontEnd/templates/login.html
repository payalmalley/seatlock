{% extends "base.html" %}
{% block title %}Log in - SeatLock{% endblock %}
{% block content %}
<div class="sl-auth-wrap">
  <div class="sl-auth">
    <h1>Welcome back</h1>
    <p class="sub">Log in to pick your seats and manage your bookings.</p>
    {% if error %}<div class="sl-alert sl-alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/login/">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="sl-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email|default:'' }}" placeholder="you@gmail.com" required autofocus>
      </div>
      <div class="sl-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required>
      </div>
      <button class="sl-btn sl-btn-block">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
