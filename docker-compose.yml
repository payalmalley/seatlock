# Phase 3: database + Django web service.
services:
  db:
    image: postgres:16
    container_name: seatlock-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - seatlock_pgdata:/var/lib/postgresql/data
      # Files run once, in name order, only when the data volume is empty.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    container_name: seatlock-web
    env_file: .env
    environment:
      POSTGRES_HOST: db      # the db service name, not localhost
      POSTGRES_PORT: 5432    # container-internal port, ignores the host mapping
    ports:
      - "8000:8000"
    volumes:
      - .:/app               # live code reload while developing
    depends_on:
      db:
        condition: service_healthy

volumes:
  seatlock_pgdata: